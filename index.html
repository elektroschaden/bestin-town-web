// ---------- Ort vorschlagen (Besucher) ----------
// Erst Google, dann der Satz: Wer einen Ort vorschlägt, tippt drei Buchstaben
// und wählt aus den Treffern — Rubrik, Maps-Link, Stadtteil und Adresse kommen
// mit. Wer gerade davorsteht, tippt „In meiner Nähe“ und bekommt die Orte um
// sich herum zur Auswahl. Der Link-Einfügen-Weg bleibt als Notausgang.
function currentPosition() {
  const fromBridge = window.BestMobile && window.BestMobile.position ? window.BestMobile.position() : Promise.resolve(null);
  return Promise.resolve(fromBridge).then(p => {
    if (p && typeof p.lat === "number") return p;
    return new Promise(resolve => {
      if (!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition(
        g => resolve({ lat: g.coords.latitude, lng: g.coords.longitude, accuracy: g.coords.accuracy || 0 }),
        () => resolve(null),
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
      );
    });
  }).catch(() => null);
}
// Ein Google-Ort in unsere Felder: gleiche Form wie der Paten-Weg, damit der
// Pate beim Übernehmen nichts doppelt eintragen muss.
function pickFromPlace(place) {
  const url = new URL("https://www.google.com/maps/search/");
  url.searchParams.set("api", "1"); url.searchParams.set("query", "Ort");
  url.searchParams.set("query_place_id", place.id);
  return {
    placeId: place.id,
    name: String(place.displayName || "").trim(),
    address: String(place.formattedAddress || "").trim(),
    kiez: kiezFromComponents(place.addressComponents),
    website: place.websiteURI || "",
    type: place.primaryTypeDisplayName ? place.primaryTypeDisplayName.text : "",
    category: guessCatFromTypes(place.types) || "",
    maps: url.href,
  };
}
function placeDistance(a, b) {
  if (!a || !b || typeof a.lat !== "number" || typeof b.lat !== "number") return null;
  const R = 6371000, rad = d => d * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
async function nearbyCandidates(pos, catId, max) {
  if (!window.google?.maps?.importLibrary) return [];
  const { Place } = await google.maps.importLibrary("places");
  const center = { lat: pos.lat, lng: pos.lng };
  const radius = Math.min(500, Math.max(150, Math.round((Number(pos.accuracy) || 60) * 2)));
  const fields = ["id", "displayName", "formattedAddress", "types", "addressComponents", "websiteURI", "primaryTypeDisplayName", "location"];
  // Ohne Rubrik (Startseite „Ort hinzufügen“) gilt die breite Auswahl aller
  // Rubrik-Typen: nur Orte, die hier überhaupt vorkommen können — keine
  // Neurologen-Praxen und Kurzwarenläden.
  const types = catId ? (NEARBY_TYPES[catId] || []) : NEARBY_TYPES_ALL;
  let places = [];
  try {
    const r = await Place.searchNearby(Object.assign({ fields, locationRestriction: { center, radius }, maxResultCount: max || 8 },
      types.length ? { includedTypes: types } : {}, types.length ? { rankPreference: "DISTANCE" } : {}));
    places = r.places || [];
  } catch (e) {
    // Fällt die Umkreissuche aus (Kontingent, Feld-Kombination), reicht die
    // Textsuche mit Standort-Bias: dieselben Orte, nur weniger streng sortiert.
    const q = CATS[catId] ? CATS[catId].name : "Restaurant";
    const r = await Place.searchByText({ textQuery: q, fields, locationBias: { center, radius }, maxResultCount: max || 8 });
    places = r.places || [];
  }
  return places.map(p => {
    const out = pickFromPlace(p);
    const loc = p.location ? { lat: p.location.lat(), lng: p.location.lng() } : null;
    out.dist = placeDistance(pos, loc);
    return out;
  }).filter(x => x.name).sort((a, b) => (a.dist == null ? 1e9 : a.dist) - (b.dist == null ? 1e9 : b.dist));
}
const NEARBY_TYPES = {
  restaurant: ["restaurant"],
  imbiss: ["meal_takeaway", "fast_food_restaurant"],
  eisdiele: ["ice_cream_shop"],
  cafe: ["cafe"],
  bar: ["bar", "pub"],
  club: ["night_club"],
  aussicht: ["tourist_attraction", "observation_deck", "park"],
  theater: ["performing_arts_theater"],
  oper: ["opera_house", "concert_hall"],
  jazz: ["live_music_venue"],
  kino: ["movie_theater"],
  museum: ["museum", "art_gallery"],
  shopping: ["shopping_mall", "clothing_store", "book_store", "gift_shop"],
  hotel: ["hotel", "lodging"],

const NEARBY_TYPES_ALL = [...new Set(Object.values(NEARBY_TYPES).flat())];
// Steht der Ort schon im Bestand? Über die Google-ID (im Maps-Link) oder über

function findExistingPlace(pick) {
  if (!pick) return null;
  const id = pick.placeId;
  if (id) { const x = state.places.find(p => mapPlaceId(p) === id); if (x) return x; }
  const n = String(pick.name || "").trim().toLowerCase();
  if (!n) return null;

function fmtDistance(m) {
  if (m == null) return "";
  return m < 950 ? Math.round(m / 10) * 10 + " m" : (m / 1000).toFixed(1).replace(".", ",") + " km";
}
// Einheitlicher „In meiner Nähe“-Knopf samt Liste — für JEDES Google-Suchfeld
// (Vorschlag, Ort eintragen, Ort bearbeiten, Startseite). catId steuert den
// Typfilter; ohne catId wird nicht gefiltert.
// Ein Weg, ein Knopf: „Suche starten". Kein Enter, kein zweites Symbol.
function nearBtnHtml(id) {
  return `<button type="button" class="btn primary wide-btn near-btn" id="${id}">Suche starten</button><div class="near-list" id="${id}-list" hidden></div>`;
}
function nearListHtml(list, title) {
  // Geordnet: erst was eine Entfernung hat (aufsteigend), danach der Rest.
  // Die Nummer am Knopf bleibt der Platz in der gelieferten Liste — sonst

  const geordnet = list.map((c, i) => ({ c, i }))

    ? geordnet.map(({ c, i }) => `<button type="button" class="near-item" data-npick="${i}"><span class="ni-main"><span class="ni-name">${esc(c.name)}</span><span class="ni-meta">${esc(c.type || "")}</span></span><span class="ni-dist">${c.dist != null ? fmtDistance(c.dist) : ""}</span></button>`).join("")

// Freitext-Suche: „vietnamesisch Friedrichshagen", „köpenick", „bölschestr.".
// Autocomplete kann das nicht (sie sagt nur Namen und Adressen voraus) — Text
// Search versteht Art und Ort. Dieselbe Trefferliste, dieselbe Übernahme.
async function searchTextCandidates(query, pos, max) {
  if (!window.google?.maps?.importLibrary) return [];
  const { Place } = await google.maps.importLibrary("places");
  const fields = ["id", "displayName", "formattedAddress", "types", "addressComponents", "websiteURI", "primaryTypeDisplayName", "location"];
  const base = { textQuery: query, fields, maxResultCount: max || 8 };
  let r = null;
  try {
    r = await Place.searchByText(pos ? Object.assign({}, base, { locationBias: { center: { lat: pos.lat, lng: pos.lng }, radius: 20000 } }) : base);
  } catch (e) {
    // Google antwortet gelegentlich mit einem internen Fehler (MapsServerError).
    // Ein zweiter Versuch ohne Standort-Bias geht fast immer durch.
    try { r = await Place.searchByText(base); } catch (e2) { r = { places: [] }; }
  }
  return (r.places || []).map(p => {
    const out = pickFromPlace(p);
    const loc = p.location ? { lat: p.location.lat(), lng: p.location.lng() } : null;
    if (loc) { out.lat = loc.lat; out.lng = loc.lng; }
    out.dist = pos && loc ? placeDistance(pos, loc) : null;

}
async function runNearby(btn, box, catId, query) {

async function buildExport(step) {
  const enc = new TextEncoder(), data = {}, missing = [], found = new Set();
  const walk = v => {
    if (typeof v === "string") { if (/^[0-9a-f]{32}$/.test(v)) found.add(v); }

    else if (v && typeof v === "object") Object.values(v).forEach(walk);
  };
  for (const c of EXPORT_COLLECTIONS) {
    step("Lese " + c + " …");
    try {
      const snap = await state.db.collection(c).get();
      data[c] = snap.docs.map(d => ({ id: d.id, data: d.data() }));
      walk(data[c].map(r => r.data));
    } catch (e) { data[c] = []; missing.push("Sammlung " + c + " nicht lesbar"); }
  }
  const files = [], images = {};
  const ids = [...found];
  for (let i = 0; i < ids.length; i++) {
    step("Bild " + (i + 1) + " von " + ids.length + " …");
    try {
      const url = photoURL(ids[i]);
      if (!url) throw new Error("Bild nicht lokal gespeichert");
      const r = await fetch(url);
      if (!r.ok) throw new Error(String(r.status));
      const b = await r.blob(), ext = IMG_EXT[b.type] || ".bin";
      const name = "bilder/" + ids[i] + ext;
      files.push({ name, data: new Uint8Array(await b.arrayBuffer()) });
      images[ids[i]] = { datei: name, typ: b.type, bytes: b.size };
    } catch (e) { missing.push("Bild " + ids[i] + " nicht abrufbar"); }
  }
  const at = new Date().toISOString();
  const counts = Object.fromEntries(EXPORT_COLLECTIONS.map(c => [c, data[c].length]));
  const json = JSON.stringify({ format: "best-in-town-export-1", exportiert: at, anzahl: counts, sammlungen: data, bilder: images }, null, 2);
  files.unshift({ name: "LIESMICH.txt", data: enc.encode(exportReadme({ at, source: location.href, missing })) });

// Die Mitgliederliste wird geladen, aber mit Zeitgrenze: die Abfrage hing auf
// Android ohne Antwort und blockierte die Einstellungsseite. Nach 6 s wird
// abgebrochen und ein ruhiger Hinweis gezeigt.
async function loadMembers() {
  const c = window.cloudApp;
  if (!c) { state.members = []; state.membersState = "offline"; renderSettings(); return; }
  state.membersState = "laedt";
  renderSettings();
  try {
    const abfrage = c.supabase.from("profiles")
      .select("id,email,role,created_at").order("created_at", { ascending: false }).limit(200);
    const antwort = await Promise.race([
      abfrage,
      new Promise((_, rej) => setTimeout(() => rej(new Error("zu lang")), 6000))
    ]);
    const data = (antwort && antwort.data) || [];
    // Nur echte Mitglieder: anonyme Gäste (ohne Adresse) gehören nicht in die Liste.
    state.members = data.filter(m => m.email);
    state.membersState = "ok";
  } catch (e) {
    state.members = [];
    state.membersState = (e && e.message === "zu lang") ? "langsam" : "fehler";
  }
  renderSettings();
}
function openSettings() {
  settingsView = "main"; $("settings").hidden = false; renderSettings();
  if ((state.role || "") === "supervisor") loadMembers();
}
function closeSettings() { $("settings").hidden = true; settingsView = "main"; }

function setupBackup(local) {
  const out = $("backupExport"), input = $("backupImport"), status = $("backupStatus");
  out.disabled = false; input.disabled = false;
  out.addEventListener("click", async () => {
    out.disabled = true;
    try {
      const backup = await local.exportBackup();
      const url = URL.createObjectURL(new Blob([JSON.stringify(backup, null, 2)], {type:"application/json"}));
      const a = document.createElement("a"); a.href = url; a.download = "best-in-town-" + new Date().toISOString().slice(0,10) + ".json"; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      status.textContent = "Backup-Download gestartet – enthält alle Einträge, Stimmen und Bilder aus der Cloud-Datenbank. Datei sicher aufbewahren.";
    } catch (error) { status.textContent = "Export fehlgeschlagen: " + error.message; }
    finally { out.disabled = false; }
  });
  input.addEventListener("change", async () => {
    const file = input.files[0]; if (!file) return;
    if (state.busy) { status.textContent = "Bitte zuerst den laufenden Speichervorgang abschließen."; input.value = ""; return; }
    state.busy = true; input.disabled = true; out.disabled = true; render();
    try {
      if (file.size > 150 * 1024 * 1024) throw Error("Backup größer als 150 MB.");
      const backup = JSON.parse(await file.text());
      const replaced = await local.importBackup(backup, () => window.confirm("Dieses Backup ersetzt ALLE Einträge, Stimmen, Paten, Vorschläge und Bilder in der gemeinsamen Cloud-Datenbank — für alle, die die App gerade offen haben. Nicht gespeicherte Formulare gehen verloren. Vorher ein Backup exportieren. Wirklich ersetzen?"));
      if (replaced) {
        for (const id of ["placeForm", "pateForm", "suggestForm"]) $(id)?.remove();
        state.form = null; state.pateForm = null; state.suggest = null; state.pending = null; state.confirmDelete = null; state.open.clear();
      }
      status.textContent = replaced ? "Backup vollständig wiederhergestellt, einschließlich Bilder." : "Import abgebrochen. Vorhandene Daten unverändert.";
    } catch (error) { status.textContent = "Import abgelehnt. Vorhandene Daten unverändert: " + error.message; }
    finally { input.value = ""; input.disabled = false; out.disabled = false; state.busy = false; render(); }
  });
}

// Loads the real role from public.profiles and drives state from it — never
// guessed client-side; RLS re-checks every write regardless of this.
async function refreshRole(cloud) {
  const { user } = cloud;
  try { state.role = await user.role(); } catch (e) { state.role = "visitor"; }
  state.isSupervisor = state.role === "supervisor";
  state.editor = state.role === "supervisor" || state.role === "pate";
  // Angemeldete Rollen (Pate, Projektleitung) starten in IHRE Ansicht — ein
  // Pate soll nicht jedes Mal erst sein eigenes Recht freischalten. Besucher
  // bekommen nichts, und „Fertig" führt jederzeit in die reine Leseansicht
  // zurück. Die Trennung der Rollen bleibt davon unberührt: Rechte hängen an
  // der Rolle aus public.profiles, nicht am Gerät.
  state.editing = state.role === "supervisor" || state.role === "pate";
  if (state.editor) watchSuggestions(cloud.db);
  if (state.role === "supervisor") { state.mode = "guest"; state.asPate = null; }
  else if (state.role === "pate") {
    state.mode = "guest";
    const mine = (state.paten || []).find(p => p.createdBy === state.uid);
    state.asPate = mine ? mine.id : null;
  } else { state.mode = "guest"; state.asPate = null; }
  try { state.isAnonymous = await user.isAnonymous(); } catch (e) { state.isAnonymous = true; }
  state.sessionKnown = true;
  // Wie oft wurde die App geöffnet? Der Community-Auftakt kommt erst, wenn man
  // die App kennt — beim ersten Mal weiß niemand, ob sie gut ist.
  if (!state.opensCounted) {
    state.opensCounted = true;
    try { state.opens = Number(localStorage.getItem("bit.opens") || 0) + 1; localStorage.setItem("bit.opens", String(state.opens)); } catch (e) { state.opens = 1; }
  }
  // Der Beitritts-Kasten erscheint einmal je Gerät; danach nur noch über die
  // Einstellungen. Niemand soll bei jedem Öffnen gefragt werden.
  // Kein automatischer Beitritts-Kasten mehr; er oeffnet nur ueber die
  // Einstellungen ("Mitglied werden").
  $("joinCommunity").hidden = !state.isAnonymous || !state.showJoin;
  if (!state.isAnonymous) $("signInExisting").hidden = true;
  $("localMode").hidden = true;
}

// Zwischenspeicher: beim nächsten Start steht der letzte Stand sofort da,
// die Cloud zieht im Hintergrund nach. Nur der allererste Start zeigt den Stempel.
const CACHE_KEY = "bit.cache.v1";
function cacheLoad() {
  try {
    const d = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if (!d || !Array.isArray(d.places) || !d.places.length) return null;
    return d;
  } catch (e) { return null; }
}
function cacheSave() {
  const full = {
    ts: Date.now(),
    role: state.role, uid: state.uid, asPate: state.asPate,
    places: state.places, votes: state.votes, paten: state.paten,
    duels: state.duels, duelVotes: state.duelVotes,
    trusted: [...(state.trusted || [])], trustedLegacy: [...(state.trustedLegacy || [])],
  };
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(full)); return; } catch (e) { /* weiter unten: kleiner versuchen */ }
  // Speicherplatz voll (Browser-Grenze meist 5–10 MB, wächst mit jeder neuen
  // Stadt): lieber ein kleinerer, aber aktueller Zwischenspeicher als gar
  // keiner. Nur die aktuelle Stadt sichern — die Cloud überschreibt den
  // Zwischenspeicher beim nächsten Start ohnehin sofort mit allen Städten,
  // das hier ist nur für den ersten Augenblick vor dem Nachladen.
  try {
    const cityIds = new Set(full.places.filter(p => cityOf(p) === state.city).map(p => p.id));
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      ...full,
      places: full.places.filter(p => cityIds.has(p.id)),
      votes: full.votes.filter(v => cityIds.has(v.placeId)),
    }));
  } catch (e) { /* auch das passt nicht: dann eben ganz ohne Zwischenspeicher starten */ }
}
let cacheTimer = null;
const cacheSoon = () => { clearTimeout(cacheTimer); cacheTimer = setTimeout(cacheSave, 1200); };
function applyCache(d) {
  state.places = d.places || [];
  state.votes = d.votes || [];
  state.paten = d.paten || [];
  state.duels = d.duels || {};
  state.duelVotes = d.duelVotes || [];
  state.trusted = new Set(d.trusted || []);
  state.trustedLegacy = new Set(d.trustedLegacy || []);
  state.role = d.role || state.role; state.uid = d.uid || state.uid;
  state.asPate = d.asPate || null; state.cachedAt = d.ts || null;
  syncCities(state.places);
  state.placesSig = placesSignature();
}
function placesSignature() {
  return state.places.map(p => p.id + "|" + (p.platz ?? "") + "|" + (p.name || "") + "|" + (p.origin || "") + "|" + (p.category || "")).join(";");
}
// Mehrere Tabellen melden Änderungen über eigene Echtzeit-Verbindungen; ohne
// gemeinsames Zeitfenster baut sich der Bildschirm bei jeder einzelnen davon
// separat neu auf, auch wenn mehrere kurz nacheinander eintreffen (normal bei
// Echtzeit-Events). Ein kurzes, gemeinsames Debounce sammelt solche Bursts zu
// EINEM Neuaufbau statt mehrerer sichtbarer Nachzieher.
let renderDebounceTimer = null;
function scheduleRender() {
  if (renderDebounceTimer) return;
  renderDebounceTimer = setTimeout(() => {
    renderDebounceTimer = null;
    requestAnimationFrame(() => { if (!state.booting) render(); });
  }, 220);
}

(async () => {
  let cloud;
  // Kein Begrüßungsbildschirm: sofort das zeigen, was da ist (letzter Stand
  // oder leere Fläche), den Rest schiebt die Cloud nach.
  const cached = cacheLoad();
  if (cached) applyCache(cached);
  state.booting = false; state.loaded = true;
  const bc = $("boot"); if (bc) bc.remove();
  document.body.classList.add("boot-reveal");
  setTimeout(() => document.body.classList.remove("boot-reveal"), 800);
  render();
  try {
    cloud = await BestCloud.open({
      url: "https://qulxubivuvowajfyfpuw.supabase.co",
      anonKey: "sb_publishable_SaXHYufMewJDyQGRu4UbOw_VJ8Vi0_B",
    });
  } catch (error) {
    // Still bleiben: mit Zwischenspeicher steht der letzte Stand ohnehin da.
    console.warn("Cloud nicht erreichbar:", error.message);
    state.booting = false; state.loaded = true;
    const b = $("boot"); if (b) b.remove(); render(); return;
  }
  window.cloudApp = cloud;
  const {db, user, assets} = cloud;
  setupBackup(cloud);
  setupJoinCommunity(cloud);
  setupSignInExisting(cloud);
  state.assets = assets || null;
  state.db = db;
  if (user) {
    try { state.uid = await user.id(); } catch (e) { state.uid = null; }
    await refreshRole(cloud);
    try { state.canVote = (await user.can("vote.cast")) !== false; } catch (e) { state.canVote = true; }
  }
  if (!db) { state.booting = false; state.loaded = true; const b = $("boot"); if (b) b.remove(); render(); return; }
  state.canVote = state.canVote && !!state.uid;
  // Sieben Sammlungen: erst wenn alle ihren ersten Stand gemeldet haben,
  // wird gezeichnet. Fehler zählen mit, damit die App nie hängen bleibt.
  const BOOT_COLLECTIONS = ["places", "votes", "paten", "duels", "duelvotes", "trusted", "trustedLegacy"];
  state.bootTotal = BOOT_COLLECTIONS.length;
  state.bootLeft = BOOT_COLLECTIONS.length;
  state.bootSeen = new Set();
  const seen = (name) => { if (!state.bootSeen.has(name)) { state.bootSeen.add(name); bootArrived(); } };
  const timer = setTimeout(() => {}, 10000);
  db.collection("places").onSnapshot(snap => {
    // Während eines Verschiebevorgangs nicht übernehmen: die Echos der
    // einzelnen Zeilen tragen sonst eine halb fertige Reihenfolge herein.
    if (state.orderHoldUntil && Date.now() < state.orderHoldUntil) { seen("places"); return; }
    state.places = snap.docs.map(d => { const x = Object.assign({ id: d.id }, d.data()); x.category = mapCat(x.category); return x; }); syncCities(state.places);
    if (!snap.metadata.fromCache) { clearTimeout(timer); state.offline = false; }
    const sig = placesSignature();
    if (sig === state.placesSig && state.loaded) { seen("places"); return; }
    state.placesSig = sig;
    seen("places"); scheduleRender(); cacheSoon();
  }, err => { clearTimeout(timer); state.offline = true; seen("places"); });
  db.collection("votes").onSnapshot(snap => {
    state.votes = snap.docs.map(d => { const x = Object.assign({ id: d.id }, d.data()); x.category = mapCat(x.category); return x; });
    seen("votes"); scheduleRender(); cacheSoon();
  }, err => { seen("votes"); /* Stimmen nicht lesbar: Ranglisten bleiben ohne Stimmen sichtbar */ });
  db.collection("paten").onSnapshot(snap => {
    state.paten = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    syncPatronCities(state.paten);
    if (state.role === "pate" && !state.asPate) {
      const mine = state.paten.find(p => p.createdBy === state.uid);
      if (mine) state.asPate = mine.id;
    }
    seen("paten"); scheduleRender(); cacheSoon();
  }, err => { seen("paten"); /* Paten nicht lesbar */ });
  db.collection("duels").onSnapshot(snap => {
    state.duels = {}; snap.docs.forEach(d => { state.duels[d.id] = d.data(); });
    seen("duels"); scheduleRender(); cacheSoon();
  }, err => { seen("duels"); /* Paar nicht lesbar: Automatik */ });
  db.collection("duelvotes").onSnapshot(snap => {
    state.duelVotes = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    seen("duelvotes"); scheduleRender(); cacheSoon();
  }, err => { seen("duelvotes"); /* Stimmen fürs Entweder – oder nicht lesbar */ });
  db.collection("trusted").onSnapshot(snap => {
    state.trusted = new Set(snap.docs.map(d => d.id));
    seen("trusted"); scheduleRender(); cacheSoon();
  }, err => { seen("trusted"); /* Freigaben nicht lesbar: Sätze bleiben verborgen */ });
  db.collection("trustedLegacy").onSnapshot(snap => {
    state.trustedLegacy = new Set(snap.docs.map(d => d.id));
    seen("trustedLegacy"); scheduleRender(); cacheSoon();
  }, err => { seen("trustedLegacy"); /* Alte Freigaben (vor Cloud-Umstellung) nicht lesbar */ });
  if (state.editor) watchSuggestions(db);
})();
</script>
